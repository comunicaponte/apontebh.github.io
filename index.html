h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:40ch;text-wrap:pretty}

section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;flex-direction:column;gap:2px;padding-inline:4px}
h2{font-family:var(--display);font-weight:500;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-desc{margin:0;color:var(--muted);font-size:.92rem}
.links{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}

a.link{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);color:var(--fg);
  border:1px solid var(--line);border-radius:14px;text-decoration:none;transition:border-color .15s, transform .15s}
a.link:hover{border-color:var(--accent);transform:translateY(-1px)}
a.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ico{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ico svg{width:20px;height:20px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.name{font-weight:700;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.chip{flex:none;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.com{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.go{flex:none;color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:14px}
footer{text-align:center;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
footer strong{font-family:var(--display);color:var(--accent);font-size:1.05rem}

/* Editor */
.edit-bar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.btn{border-radius:999px;padding:10px 18px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.6;cursor:default}
.editor{display:flex;flex-direction:column;gap:20px;padding-bottom:64px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>label{flex:1 1 180px}
.mini{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:5px 10px;font-size:.85rem}
.mini.danger{color:var(--warn)}
.hint{font-size:.8rem;color:var(--warn);font-weight:400}
.status{font-size:.9rem;color:var(--muted);text-align:center;min-height:1.4em}
.draft{opacity:.55}
@media (prefers-reduced-motion: reduce){a.link{transition:none}a.link:hover{transform:none}}

  var draft = null, editing = false, saving = false;
  var $ = function(id){ return document.getElementById(id); };

  var ICON_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>';
  var ICON_PEOPLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.5.2 4.3 1.9 5 5"/></svg>';
  var ICON_GO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function validUrl(u){ return /^https:\/\/\S+$/i.test(String(u || "").trim()); }
  function uid(){ return "x" + Math.random().toString(36).slice(2, 9); }

  function renderPublic(){
    document.title = data.title || "A Ponte BH";
    $("title").textContent = data.title || "";
    $("lead").textContent = data.lead || "";
    $("foot").textContent = data.foot || ""; $("foot").hidden = !data.foot;
    var html = "", any = false;
    data.sections.forEach(function(sec){
      var items = sec.items.filter(function(it){ return validUrl(it.url); });
      if (!items.length) return;
      any = true;
      html += '<section><div class="sec-head"><h2>' + esc(sec.name) + '</h2>' + (sec.desc ? '<p class="sec-desc">' + esc(sec.desc) + '</p>' : '') + '</div><ul class="links">';
      items.forEach(function(it){
        var com = it.type === "comunidade";
        html += '<li><a class="link" href="' + esc(it.url.trim()) + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="ico">' + (com ? ICON_PEOPLE : ICON_CHAT) + '</span>' +
          '<span class="txt"><span class="name">' + esc(it.label) + '</span>' + (it.desc ? '<span class="desc">' + esc(it.desc) + '</span>' : '') + '</span>' +
          (it.type ? '<span class="chip' + (com ? ' com' : '') + '">' + (com ? 'Comunidade' : 'Grupo') + '</span>' : '') +
          '<span class="go">' + ICON_GO + '</span></a></li>';
      });
      html += '</ul></section>';
    });
    if (!any) html = '<p class="empty">Os links dos grupos estarão disponíveis aqui em breve.</p>';
    $("main").innerHTML = '<div style="display:flex;flex-direction:column;gap:28px">' + html + '</div>';
  }

  function field(label, path, value, opts){
    opts = opts || {};
    var id = "f-" + path.replace(/\./g, "-");
    var ctrl;
    if (opts.select) {
      ctrl = '<select id="' + id + '" data-path="' + path + '">' + opts.select.map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === value ? ' selected' : '') + '>' + o[1] + '</option>'; }).join("") + '</select>';
    } else {
      ctrl = '<input id="' + id + '" data-path="' + path + '" value="' + esc(value) + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + (opts.type ? ' type="' + opts.type + '"' : '') + '>';
    }
    return '<label for="' + id + '">' + label + (opts.hint ? ' <span class="hint">' + opts.hint + '</span>' : '') + ctrl + '</label>';
  }

  function renderEditor(){
    var d = draft, h = '<div class="editor">';
    h += '<p class="note">Cole o link de convite de cada grupo ou comunidade (ex.: https://chat.whatsapp.com/...). Itens sem link ficam ocultos para o público. Toque em <strong>Salvar</strong> para publicar.</p>';
    h += '<div class="card"><h2>Cabeçalho</h2>' + field("Título", "title", d.title) + field("Texto de apresentação", "lead", d.lead) + field("Rodapé", "foot", d.foot) + '</div>';
    d.sections.forEach(function(sec, si){
      h += '<div class="card"><div class="row"><h2 style="flex:1">Seção ' + (si + 1) + '</h2>' +
        '<button class="mini" data-act="secUp" data-s="' + si + '" type="button" aria-label="Mover seção para cima">↑</button>' +
        '<button class="mini" data-act="secDown" data-s="' + si + '" type="button" aria-label="Mover seção para baixo">↓</button>' +
        '<button class="mini danger" data-act="secDel" data-s="' + si + '" type="button">Excluir seção</button></div>';
      h += '<div class="row">' + field("Nome da seção", "sections." + si + ".name", sec.name) + field("Descrição (opcional)", "sections." + si + ".desc", sec.desc) + '</div>';
      sec.items.forEach(function(it, ii){
        var p = "sections." + si + ".items." + ii + ".";
        var bad = it.url && !validUrl(it.url);
        h += '<div class="item' + (validUrl(it.url) ? '' : ' draft') + '"><div class="row">' +
          field("Nome", p + "label", it.label) +
          field("Etiqueta", p + "type", it.type, {select:[["","Sem etiqueta"],["comunidade","Comunidade"],["grupo","Grupo"]]}) + '</div>' +
          field("Descrição (opcional)", p + "desc", it.desc) +
          field("Link de convite", p + "url", it.url, {ph:"https://chat.whatsapp.com/...", type:"url", hint: bad ? "O link precisa começar com https://" : (it.url ? "" : "sem link, oculto")}) +
          '<div class="row"><button class="mini" data-act="itUp" data-s="' + si + '" data-i="' + ii + '" type="button" aria-label="Mover para cima">↑</button>' +
          '<button class="mini" data-act="itDown" data-s="' + si + '" data-i="' + ii + '" type="button" aria-label="Mover para baixo">↓</button>' +
          '<button class="mini danger" data-act="itDel" data-s="' + si + '" data-i="' + ii + '" type="button">Excluir link</button></div></div>';
      });
      h += '<div class="row"><button class="mini" data-act="itAdd" data-s="' + si + '" type="button">+ Adicionar link</button></div></div>';
    });
    h += '<div class="row" style="justify-content:center"><button class="btn" data-act="secAdd" type="button">+ Adicionar seção</button></div>';
    h += '<p class="status" id="status" role="status"></p></div>';
    $("main").innerHTML = h;
  }

  function setPath(obj, path, val){
    var ks = path.split("."), o = obj;
    for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = val;
  }
  function move(arr, i, d){ var j = i + d; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

  $("main").addEventListener("input", function(e){
    var p = e.target.getAttribute && e.target.getAttribute("data-path");
    if (p && draft) setPath(draft, p, e.target.value);
  });
  $("main").addEventListener("change", function(e){
    var p = e.target.getAttribute && e.target.getAttribute("data-path");
    if (p && /\.url$/.test(p)) { var y = window.scrollY; renderEditor(); window.scrollTo(0, y); }
  });
  $("main").addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("[data-act]");
    if (!b || !draft) return;
    var a = b.getAttribute("data-act"), si = +b.getAttribute("data-s"), ii = +b.getAttribute("data-i");
    var secs = draft.sections;
    if (a === "secAdd") secs.push({id:uid(), name:"Nova seção", desc:"", items:[]});
    if (a === "secDel") secs.splice(si, 1);
    if (a === "secUp") move(secs, si, -1);
    if (a === "secDown") move(secs, si, 1);
    if (a === "itAdd") secs[si].items.push({id:uid(), label:"", desc:"", url:"", type:""});
    if (a === "itDel") secs[si].items.splice(ii, 1);
    if (a === "itUp") move(secs[si].items, ii, -1);
    if (a === "itDown") move(secs[si].items, ii, 1);
    var y = window.scrollY; renderEditor(); window.scrollTo(0, y);
  });

  function buildDoc(next){
    var s = bodySrc.indexOf(START), e = bodySrc.indexOf(END);
    var src = bodySrc.slice(s, e + END.length);
    var json = JSON.stringify(next).replace(/</g, "\\u003c");
    src = src.replace(/(<script type="application\/json" id="page-data">)[\s\S]*?(<\/script>)/, function(_, a, b){ return a + json + b; });
    src = src.replace(/<title>[\s\S]*?<\/title>/, "<title>Ponte BH Links</title>");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style></head><body>' + src + '</body></html>';
  }

  function startEdit(){
    editing = true; draft = JSON.parse(JSON.stringify(data));
    $("editBtn").textContent = "Salvar"; $("cancelBtn").hidden = false;
    renderEditor();
  }
  function stopEdit(){
    editing = false; draft = null;
    $("editBtn").textContent = "Editar links"; $("cancelBtn").hidden = true;
    renderPublic();
  }
  async function save(art){
    if (saving) return;
    var bad = [];
    draft.sections.forEach(function(s){ s.items.forEach(function(it){ if (it.url && !validUrl(it.url)) bad.push(it.label || "sem nome"); }); });
    if (bad.length) { $("status").textContent = "Corrija os links que não começam com https://: " + bad.join(", "); return; }
    saving = true; $("editBtn").disabled = true; $("status").textContent = "Publicando…";
    var next = draft;
    try {
      await art.publish(buildDoc(next));
      data = next; stopEdit();
    } catch (err) {
      var code = err && err.code;
      $("status").textContent = code === "conflict" ? "Outra pessoa salvou ao mesmo tempo. A página vai recarregar com a versão mais nova."
        : (code === "not_writer" || code === "not_granted") ? "Você não tem permissão para editar esta página."
        : "Não foi possível salvar agora. Tente de novo em instantes.";
    } finally { saving = false; $("editBtn").disabled = false; }
  }

  renderPublic();

  (async function(){
    if (!window.claude || !window.claude.use) return;
    var user = await window.claude.use("user");
    var can = user ? await user.canEdit() : false;
    if (!can) return;
    var art = await window.claude.use("artifact");
    if (!art) return;
    $("editBar").hidden = false;
    $("editBtn").addEventListener("click", function(){ editing ? save(art) : startEdit(); });
    $("cancelBtn").addEventListener("click", stopEdit);
  })();
})();
</script>
<!--PAGE-END-->
</body></html>
